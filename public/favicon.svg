<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#0d1b36"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Gold Accent Gradient (History / Civ) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan Glow Gradient (World / Knowledge) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#cyanGrad)" stroke-width="7" opacity="0.35"/>

  <!-- WORLD: Globe & Meridians (Centered behind Temple) -->
  <g opacity="0.55" transform="translate(0, -10)">
    <!-- Globe Outer Ring -->
    <circle cx="256" cy="235" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="8 6"/>
    <!-- Equator / Latitudes -->
    <ellipse cx="256" cy="235" rx="140" ry="50" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.6"/>
    <!-- Prime Meridian -->
    <ellipse cx="256" cy="235" rx="55" ry="140" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.6"/>
    <!-- Central Axis Line -->
    <line x1="256" y1="95" x2="256" y2="375" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- PEDIA: Open Book Base (Foundation of Knowledge) -->
  <g transform="translate(0, 15)">
    <!-- Book Pages Glow / Shadow -->
    <path d="M256 362 C210 338 145 334 86 352 C84 353 82 355 82 358 L82 388 C82 391 84 393 87 392 C145 374 210 378 256 404 C302 378 367 374 425 392 C428 393 430 391 430 388 L430 358 C430 355 428 353 426 352 C367 334 302 338 256 362 Z"
          fill="#0369a1" opacity="0.5"/>
    <!-- Main Open Book Wings -->
    <path d="M256 348 C212 322 146 318 86 338 C83 339 80 342 80 346 L80 376 C80 380 84 383 87 382 C145 363 210 367 256 394 C302 367 367 363 425 382 C428 383 432 380 432 376 L432 346 C432 342 429 339 426 338 C366 318 300 322 256 348 Z"
          fill="#f0f9ff"/>
    <!-- Spine / Center seam -->
    <line x1="256" y1="348" x2="256" y2="394" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- HISTORY: Ancient Temple / Pantheon (Civilization & History) -->
  <g id="temple" filter="url(#glow)">
    <!-- Pediment (Roof Triangle) -->
    <polygon points="256,92 128,172 384,172" fill="url(#goldGrad)"/>
    <!-- Inner Pediment Accent -->
    <polygon points="256,122 166,166 346,166" fill="#78350f" opacity="0.75"/>
    <circle cx="256" cy="148" r="10" fill="#fbbf24"/>

    <!-- Entablature (Beam below pediment) -->
    <rect x="120" y="172" width="272" height="18" rx="4" fill="url(#goldGrad)"/>
    <!-- Frieze accent -->
    <rect x="136" y="190" width="240" height="8" rx="2" fill="#d97706"/>

    <!-- Pillars (4 Iconic Classical Columns) -->
    <!-- Column 1 -->
    <rect x="144" y="198" width="26" height="116" rx="4" fill="url(#goldGrad)"/>
    <rect x="140" y="198" width="34" height="8" rx="2" fill="#fef08a"/>
    <rect x="140" y="306" width="34" height="8" rx="2" fill="#d97706"/>

    <!-- Column 2 -->
    <rect x="212" y="198" width="26" height="116" rx="4" fill="url(#goldGrad)"/>
    <rect x="208" y="198" width="34" height="8" rx="2" fill="#fef08a"/>
    <rect x="208" y="306" width="34" height="8" rx="2" fill="#d97706"/>

    <!-- Column 3 -->
    <rect x="274" y="198" width="26" height="116" rx="4" fill="url(#goldGrad)"/>
    <rect x="270" y="198" width="34" height="8" rx="2" fill="#fef08a"/>
    <rect x="270" y="306" width="34" height="8" rx="2" fill="#d97706"/>

    <!-- Column 4 -->
    <rect x="342" y="198" width="26" height="116" rx="4" fill="url(#goldGrad)"/>
    <rect x="338" y="198" width="34" height="8" rx="2" fill="#fef08a"/>
    <rect x="338" y="306" width="34" height="8" rx="2" fill="#d97706"/>

    <!-- Stylobate (Temple Base Steps) -->
    <rect x="126" y="314" width="260" height="14" rx="3" fill="url(#goldGrad)"/>
    <rect x="112" y="328" width="288" height="16" rx="4" fill="#b45309"/>
  </g>

  <!-- Sparkle of Wisdom / History Star -->
  <g transform="translate(256, 70)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
